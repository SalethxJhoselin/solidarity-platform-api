server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-uagrm
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres.stfuvpyvcwyneksyueix}
    password: ${DB_PASSWORD:6rVtE6HeExodlhxq}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,https://*.vercel.app,https://*.onrender.com}

jwt:
  secret: ${JWT_SECRET:bXktdmVyeS1zZWNyZXQtYW5kLXVsdHJhLWxvbmctc2VjcmV0LWtleS1mb3Itand0LWdlbmVyYXRpb24tMTIzNDU2Nzg5MA==}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
